<!DOCTYPE html>
<html>
<head>
    <title>Sea View</title>

    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
        }

        .header {
            width: 800px;
            height: 250px;

            background-image: url("beach.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

            position: relative;
        }

        .judul {
            position: absolute;
            top: 15px;
            right: 30px;

            font-size: 25px;
            color: #dddddd;

            text-shadow: 2px 2px 3px #333333;
        }

        .deskripsi {
            position: absolute;
            bottom: 15px;
            left: 35px;

            width: 280px;

            text-align: center;

            font-size: 11px;
            line-height: 2;
            word-spacing: 7px;
            letter-spacing: 1px;

            color: white;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="judul">
            PANTAI INDONESIA
        </div>

        <div class="deskripsi">
            Indonesia merupakan salah satu negara kepulauan terbesar di Dunia.
        </div>

    </div>

</body>
</html>
