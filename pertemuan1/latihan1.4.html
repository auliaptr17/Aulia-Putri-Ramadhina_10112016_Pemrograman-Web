<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengertian DIV</title>
</head>
<body>
    <div style="color: #ffffff; margin: 0; background-color: yellow; padding: 20px; font-size: 1.5em; text-align: center;">HEADER</div>
    <div style="color: #ffffff; margin: 0; background-color: green; width: 21%; padding: 40px 20px; float: left; font-size: 1.5em; text-align: center;">SIDEBAR</div>
    <div style="color: #ffffff; margin: 0; background-color: blue; width: 66%; padding: 40px 20px; float: right; font-size:  1.5em; text-align: center;">CONTENT</div>
    <div style="color: #ffffff; margin: 0; background-color: orange; padding: 20px; clear:both; font-size: 1.5em; text-align: center;">FOOTER</div>
</body>
</html>
